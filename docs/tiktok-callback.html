<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Authorization complete — Avila Auto Publisher</title>
<!--
  TikTok authorization landing page.

  Must stay deliberately dumb: no router, no redirect, no script touching
  the URL. The operator reads the `code` parameter from this window's
  address bar, so any client-side rewrite would lose the code and leave
  the connection hanging.

  The code is never shown or sent anywhere: it stays in the URL, which
  only ever lives inside the operator's own browser window.
-->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0b1220; color: #eef2ff;
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 380px; text-align: center;
    background: #141d33; border: 1px solid #22304f;
    border-radius: 14px; padding: 32px 28px;
  }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(90, 169, 255, .16);
    color: #5aa9ff; font-size: 22px;
  }
  h1 { margin: 0 0 8px; font-size: 18px; }
  p { margin: 0; color: #9aa7c7; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">&#10003;</div>
    <h1>Authorization complete</h1>
    <p>You can close this window and go back to Avila Auto Publisher.</p>
  </div>
</body>
</html>
